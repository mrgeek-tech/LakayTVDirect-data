name: Mirror TheSportsDB

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy TheSportsDB answers
        env:
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
        run: python3 scripts/mirror.py
      - name: Commit
        run: |
          git config user.name "LakayTV Direct data"
          git config user.email "actions@users.noreply.github.com"
          git add -A v1
          git diff --cached --quiet || git commit -m "TheSportsDB copy $(date -u +%Y-%m-%d)"
          git push
